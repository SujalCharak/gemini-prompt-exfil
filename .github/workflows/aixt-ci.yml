name: aixt-ci
on: [push, pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest ruff bandit mypy

      # Static checks
      - run: ruff check aixt
      - run: bandit -r aixt
      - run: mypy aixt

      # Eval harness (non-fatal if no API key)
      - run: python aixt/harness/run_baseline.py || echo "Baseline skipped"

      # Tests (optional until tests exist)
      - run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests yet — skipping pytest"
          fi
